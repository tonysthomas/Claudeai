<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: #000;
        font-family: "Inter", system-ui, sans-serif;
      }

      :root {
        --ink: #0E1626;
        --plate: rgba(12, 20, 34, 0.82);
        --text: #FFFFFF;
        --dim: #AEB9CC;
        --gold: #FFC24B;
        --sky: #5AA9FF;
        --line: rgba(255, 255, 255, 0.14);
      }

      /* ---- base video ---- */
      #speaker {
        position: absolute; inset: 0;
        width: 1920px; height: 1080px;
        object-fit: cover; object-position: center;
        z-index: 1;
      }

      /* ---- subtle vignette to focus the frame ---- */
      #vignette {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background:
          radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.28) 100%);
      }

      /* ---- shared overlay type ---- */
      .kicker {
        font-weight: 700; font-size: 22px; letter-spacing: 0.22em;
        text-transform: uppercase; color: var(--gold);
      }
      .plate {
        background: var(--plate);
        border: 1px solid var(--line);
        border-radius: 16px;
        backdrop-filter: blur(2px);
      }

      /* ---- brand bug (top-left, persistent) ---- */
      #bug {
        position: absolute; left: 90px; top: 74px; z-index: 20; opacity: 0;
        display: flex; align-items: center; gap: 12px;
        padding: 12px 20px 12px 16px;
      }
      #bug .dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: var(--gold); box-shadow: 0 0 14px rgba(255,194,75,0.7);
      }
      #bug .txt {
        font-weight: 800; font-size: 22px; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--text);
      }

      /* ---- left-column card cluster ---- */
      .lcard {
        position: absolute; left: 90px; z-index: 15; opacity: 0;
        width: 380px; padding: 26px 28px;
        display: flex; flex-direction: column; gap: 12px;
      }
      #hook  { top: 300px; }
      #kp    { top: 300px; }
      #name  { top: 320px; }
      #agenda{ top: 250px; }

      .lcard .big {
        font-weight: 800; font-size: 38px; line-height: 1.1;
        letter-spacing: -0.01em; color: var(--text);
      }
      .lcard .big.accent { color: var(--gold); }
      .lcard .sub { font-weight: 600; font-size: 24px; color: var(--dim); }

      .rule {
        height: 4px; width: 64px; border-radius: 3px;
        background: var(--gold);
      }

      /* name card */
      #name .who { font-weight: 800; font-size: 44px; color: var(--text); letter-spacing: -0.01em; }
      #name .role { font-weight: 600; font-size: 24px; color: var(--dim); }

      /* agenda */
      #agenda .title { font-weight: 700; font-size: 22px; letter-spacing: 0.2em;
        text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
      .arow { display: flex; align-items: baseline; gap: 16px; opacity: 0; }
      .arow .idx { font-weight: 800; font-size: 30px; color: var(--sky);
        font-variant-numeric: tabular-nums; min-width: 42px; }
      .arow .lbl { font-weight: 700; font-size: 34px; color: var(--text); }

      /* ---- captions (bottom-center) ---- */
      #caps { position: absolute; left: 0; right: 0; bottom: 66px; z-index: 30; }
      .cg {
        position: absolute; left: 0; right: 0; bottom: 0;
        text-align: center; opacity: 0;
      }
      .pill {
        display: inline-block; max-width: 1500px;
        padding: 16px 30px; border-radius: 18px;
        background: var(--plate); border: 1px solid var(--line);
        box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      }
      .cw {
        display: inline-block; color: #fff; opacity: 0.38;
        font-weight: 800; font-size: 56px; line-height: 1.14;
        letter-spacing: -0.005em; margin: 0 9px; transform-origin: center bottom;
      }

      /* ---- outro (bottom-center, after speech) ---- */
      #outro {
        position: absolute; left: 0; right: 0; bottom: 96px; z-index: 25;
        text-align: center; opacity: 0;
      }
      #outro .inner { display: inline-flex; flex-direction: column; align-items: center;
        gap: 10px; padding: 26px 46px; }
      #outro .brand { font-weight: 800; font-size: 26px; letter-spacing: 0.18em;
        text-transform: uppercase; color: var(--gold); }
      #outro .line { font-weight: 800; font-size: 44px; color: var(--text); letter-spacing: -0.01em; }
      #outro-scrim {
        position: absolute; left: 0; right: 0; bottom: 0; height: 340px; z-index: 24;
        opacity: 0; pointer-events: none;
        background: linear-gradient(to top, rgba(6,10,18,0.85), rgba(6,10,18,0));
      }
    </style>
  </head>

  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="51"
      data-width="1920"
      data-height="1080"
    >
      <!-- base footage: framework-managed video clip -->
      <video
        id="speaker"
        data-start="0"
        data-duration="51"
        data-track-index="0"
        src="assets/speaker.mp4"
        muted
        playsinline
      ></video>

      <!-- voice (original audio) -->
      <audio
        id="voice"
        data-start="0"
        data-duration="51"
        data-track-index="2"
        src="assets/speaker.mp4"
        data-volume="1"
      ></audio>

      <!-- music bed (pre-ducked + faded in ffmpeg) -->
      <audio
        id="music"
        data-start="0"
        data-duration="51"
        data-track-index="3"
        src="assets/music-bed-mix.mp3"
        data-volume="1"
      ></audio>

      <!-- focus vignette -->
      <div id="vignette"></div>

      <!-- persistent brand bug -->
      <div id="bug">
        <span class="dot"></span>
        <span class="txt">It's&nbsp;AI&nbsp;Education</span>
      </div>

      <!-- HOOK (left) -->
      <div id="hook" class="lcard">
        <div class="kicker">The setup</div>
        <div id="hook-l1" class="big">Same question, asked twice.</div>
        <div id="hook-l2" class="big accent">Two different answers.</div>
      </div>

      <!-- KEY POINT (left) -->
      <div id="kp" class="lcard">
        <div class="kicker">Why it matters</div>
        <div id="kp-big" class="big">The one difference that defines AI</div>
        <div id="kp-rule" class="rule"></div>
        <div id="kp-sub" class="sub">in 2026</div>
      </div>

      <!-- NAME CARD (left) -->
      <div id="name" class="lcard">
        <div id="name-who" class="who">Tony Thomas</div>
        <div id="name-role" class="role">It's AI Education&nbsp;·&nbsp;Lesson 3</div>
      </div>

      <!-- AGENDA (left) -->
      <div id="agenda" class="lcard">
        <div id="agenda-title" class="title">In this video</div>
        <div id="a1" class="arow"><span class="idx">01</span><span class="lbl">The idea</span></div>
        <div id="a2" class="arow"><span class="idx">02</span><span class="lbl">A live demo</span></div>
        <div id="a3" class="arow"><span class="idx">03</span><span class="lbl">3 takeaways</span></div>
      </div>

      <!-- OUTRO (bottom) -->
      <div id="outro-scrim"></div>
      <div id="outro">
        <div class="inner">
          <div class="brand">It's AI Education</div>
          <div class="line">Lesson 3 — What is Generative AI?</div>
        </div>
      </div>

      <!-- captions get injected here -->
      <div id="caps"></div>
    </div>

    <script>
      // ---- transcript (word-level, embedded; times are relative to speaker.mp4) ----
      var WORDS = [

        {"text":"engine","start":8.57,"end":9.06},{"text":"never","start":9.06,"end":9.47},
        {"text":"does","start":9.47,"end":9.8},{"text":"that.","start":9.8,"end":10.4},

        {"text":"get","start":13.5,"end":13.65},{"text":"the","start":13.74,"end":13.92},

      ];

      // ---- group words into caption chunks (<=5 words, break on sentence end / >=0.5s pause) ----
      function groupWords(words) {
        var groups = [], cur = [];
        for (var i = 0; i < words.length; i++) {
          var w = words[i], next = words[i + 1];
          cur.push(w);
          var endsSentence = /[.?!]$/.test(w.text);
          var gap = next ? (next.start - w.end) : 0;
          if (!next || endsSentence || cur.length >= 5 || gap >= 0.5) {
            groups.push({ words: cur, start: cur[0].start, end: cur[cur.length - 1].end });
            cur = [];
          }
        }
        return groups;
      }
      var GROUPS = groupWords(WORDS);

      // ---- render caption DOM (before building the timeline) ----
      var capsEl = document.getElementById("caps");
      GROUPS.forEach(function (g, gi) {
        var cg = document.createElement("div");
        cg.className = "cg"; cg.id = "cg-" + gi;
        var pill = document.createElement("div");
        pill.className = "pill";
        g.words.forEach(function (w, wi) {
          var s = document.createElement("span");
          s.className = "cw"; s.id = "w-" + gi + "-" + wi;
          s.textContent = w.text;
          pill.appendChild(s);
        });
        cg.appendChild(pill);
        capsEl.appendChild(cg);
      });

      // ---- build the timeline ----
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // brand bug
      tl.fromTo("#bug", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.5);
      tl.to("#bug", { opacity: 0, y: -10, duration: 0.4, ease: "power2.in" }, 50.4);

      // HOOK  (2.0 -> 8.2)
      tl.fromTo("#hook", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.6);
      tl.from("#hook .kicker", { opacity: 0, y: 14, duration: 0.3, ease: "power3.out" }, 1.7);

      tl.from("#hook-l2", { opacity: 0, y: 22, duration: 0.34, ease: "power3.out" }, 5.5);
      tl.to("#hook", { opacity: 0, y: -12, duration: 0.3, ease: "power2.in" }, 8.0);

      tl.from("#name-role", { opacity: 0, x: -18, duration: 0.34, ease: "power2.out" }, 29.55);

      tl.from("#agenda-title", { opacity: 0, y: 14, duration: 0.3, ease: "power3.out" }, 40.8);

      GROUPS.forEach(function (g, gi) {

        tl.fromTo(cgSel, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, Math.max(0, g.start - 0.12));
        // karaoke per word

          var wSel = "#w-" + gi + "-" + wi;
          tl.set(wSel, { opacity: 1 }, w.start);
          tl.to(wSel, { color: ACCENT, scale: 1.08, duration: 0.1, ease: "power2.out" }, w.start);
          var revertAt = (wi < g.words.length - 1) ? g.words[wi + 1].start : w.end;
          revertAt = Math.max(w.start + 0.11, revertAt - 0.02);
          tl.to(wSel, { color: "#ffffff", scale: 1.0, duration: 0.12, ease: "power2.inOut" }, revertAt);
        });
        // exit + hard kill
        tl.to(cgSel, { opacity: 0, y: -10, duration: 0.14, ease: "power2.in" }, g.end);
        tl.set(cgSel, { opacity: 0, visibility: "hidden" }, g.end + 0.14);
      });

        var el = document.getElementById("cg-" + gi);

      tl.seek(0);

</html>
